; Private copy only. Original executable/gameplay remain unmodified.
; Pinned package and SHA256 are recorded in logs/dxwrapper-provenance.json.
[General]
RealDllPath=AUTO
WrapperMode=AUTO
IncludeProcess=Morrowind.exe
DisableLogging=0

[Plugins]
LoadPlugins=0
LoadFromScriptsOnly=0

[Compatibility]
D3d8to9=1
EnableD3d9Wrapper=1
D3d9to9Ex=1
Dinputto8=0
EnableDinput8Wrapper=0
EnableDsoundWrapper=0
DDrawCompat=0
DisableGameUX=0
HandleExceptions=0

[d3d9]
FlipEx=1
EnableWindowMode=1
WindowModeBorder=1
FullscreenWindowMode=0
ForceExclusiveFullscreen=0
SetInitialWindowPosition=1
InitialWindowPositionLeft=8
InitialWindowPositionTop=32
LimitPerFrameFPS=60

[FullScreen]
FullScreen=0
ForceWindowResize=0
