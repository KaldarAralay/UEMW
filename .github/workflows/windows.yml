name: Windows source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  owned-data-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Python dependencies
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Build the owned read-batch test helper
        shell: pwsh
        run: ./tools/build-read-batch.ps1 -AllowNewerCompiler
      - name: Run Python tests and publication audit
        shell: pwsh
        run: |
          python tools/run_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/audit_repository.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./tools/test-portability.ps1

  # Full UE builds require a separately licensed UE 5.2.1 installation.
  # No game, Steam files or generated Bethesda assets are used/uploaded here.
